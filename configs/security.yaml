# Policy values from SECURITY_POLICY.md. Change a value here and restart the
# coordinator; no code changes. Secrets do NOT go in this file.
token:
  ttl_seconds: 300

replay_protection:            # M5 defines, B1 enforces
  window_seconds: 60
  clock_skew_tolerance_seconds: 5

rate_limit:
  connection_level:           # B1
    bucket_capacity: 20
    refill_per_second: 5
  node_level:                 # A1; fraction of each node's OWN capacity
    max_memory_fraction_per_client: 0.5   # x total_capacity_bytes at node startup
    max_objects_per_client: 10000         # absolute count, per client per node

trust_state:
  suspicious_trigger:
    failed_auths_per_window: 3
    window_seconds: 60
  recovery_clean_period_seconds: 300

enrollment:                   # names of the environment variables, not the secrets
  node_secret_env: DSM_NODE_ENROLLMENT_SECRET
  client_secret_env: DSM_CLIENT_ENROLLMENT_SECRET
  denylist_path: data/denylist.json

audit:
  path: data/audit.jsonl
  max_bytes: 5242880          # rotate the log at 5 MiB
  backup_count: 5