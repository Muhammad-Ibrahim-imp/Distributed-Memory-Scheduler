[pytest]
# adds the repo root to the import path so "from dsm...." and "from common...." work
pythonpath = .
# every "async def test_..." runs without needing a decorator on each one
asyncio_mode = auto
# only look for tests in the tests/ folder
testpaths = tests
markers =
    integration: cross-component tests (M5)
    security: central-security tests (M5)
