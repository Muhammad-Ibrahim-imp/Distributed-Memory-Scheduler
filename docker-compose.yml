services:
  coordinator:
    build: .
    command: python scripts/coordinator_main.py
    environment:
      SERVICE_ROLE: coordinator
      SECURITY_PORT: "8443"
      DSM_TOKEN_KEY: ${DSM_TOKEN_KEY:-}      
      DSM_NODE_ENROLLMENT_SECRET: ${DSM_NODE_ENROLLMENT_SECRET:-}
      DSM_CLIENT_ENROLLMENT_SECRET: ${DSM_CLIENT_ENROLLMENT_SECRET:-}
    ports:
      - "8443:8443"
    volumes:
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - coordinator-data:/app/data
    networks: [dsm-net]

  node:
    build: .
    command: python scripts/node_main.py
    environment:
      SERVICE_ROLE: node
      SECURITY_HOST: coordinator
      SECURITY_PORT: "8443"
      DSM_NODE_ENROLLMENT_SECRET: ${DSM_NODE_ENROLLMENT_SECRET:-}
      NODE_ID: "node-1"
    volumes:
      - ./certs:/app/certs:ro
    mem_limit: 512m
    depends_on: [coordinator]
    networks: [dsm-net]

  client:
    build: .
    command: sleep infinity
    environment:
      SECURITY_HOST: coordinator
      SECURITY_PORT: "8443"
    volumes:
      - ./certs:/app/certs:ro
    depends_on: [coordinator]
    networks: [dsm-net]

networks:
  dsm-net: {}

volumes:
  coordinator-data: {}