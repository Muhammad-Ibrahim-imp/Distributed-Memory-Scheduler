syntax = "proto3";
package dsm.protocol;

message Envelope {
  uint32 protocol_version = 1;
  string identity = 2;
  string token = 3;
  string nonce = 4;
  double timestamp = 5;
  string coordinator_generation = 6; // A1 fencing

  oneof payload {
    Register register = 10;
    RegisterResponse register_response = 11;
    Refresh refresh = 12;
    RefreshResponse refresh_response = 13;
    AllocateRequest alloc = 15;
    AllocateResponse alloc_response = 16;
    ReadRequest read = 17;
    ReadResponse read_response = 18;
    WriteRequest write = 19;
    WriteResponse write_response = 20;
    FreeRequest free = 21;
    FreeResponse free_response = 22;
    StatsRequest stats = 23;
    NodeStatsReport node_stats = 24;
    ErrorResponse error = 25;
    SecurityEvent security_event = 26; // A2 event forwarding
  }
}

message Register { string request_id = 1; string enrollment_secret = 2; string role = 3; string label = 4; string client_nonce = 5; }
message RegisterResponse { string request_id = 1; string identity = 2; string credential = 3; }
message Refresh { string request_id = 1; string identity = 2; string credential = 3; }
message RefreshResponse { string request_id = 1; string token = 2; }
message AllocateRequest { string request_id = 1; string object_id = 2; uint64 size = 3; string owner_identity = 4; }
message AllocateResponse { string request_id = 1; string object_id = 2; }
message ReadRequest { string request_id = 1; string object_id = 2; string owner_identity = 3; }
message ReadResponse { string request_id = 1; bytes data = 2; }
message WriteRequest { string request_id = 1; string object_id = 2; string owner_identity = 3; bytes data = 4; }
message WriteResponse { string request_id = 1; }
message FreeRequest { string request_id = 1; string object_id = 2; string owner_identity = 3; }
message FreeResponse { string request_id = 1; }
message StatsRequest { string request_id = 1; }
message NodeStatsReport { string request_id = 1; string node_id = 2; uint64 total_memory = 3; uint64 used_memory = 4; uint64 available_memory = 5; double cpu_percent = 6; uint64 object_count = 7; double health = 8; }
message ErrorResponse { bool ok = 1; string code = 2; string message = 3; string request_id = 4; }

message SecurityEvent {
  string event_id = 1;
  double timestamp = 2;
  string event_type = 3;
  string severity = 4;
  string actor_id = 5;
  string result = 6;
  string request_id = 7;
  map<string, string> extra = 8;
}
